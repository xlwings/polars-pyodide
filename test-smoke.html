<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Polars Pyodide Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #569cd6; }
    #output { white-space: pre; background: #252526; padding: 16px; border-radius: 4px; min-height: 200px; }
    .ok   { color: #4ec9b0; }
    .err  { color: #f48771; }
    .info { color: #9cdcfe; }
    .fail { color: #f48771; font-weight: bold; }
    .pass { color: #4ec9b0; }
  </style>
</head>
<body>
  <h1 id="title">Polars / Pyodide smoke test</h1>
  <div id="output">Loading Pyodide…</div>
  <script>
    // Allow overriding pyodide version via ?pyodide=314.0.0a1 query param
    const PYODIDE_VERSION = new URLSearchParams(location.search).get('pyodide') || '0.29.3';
    document.getElementById('title').textContent = `Polars / Pyodide ${PYODIDE_VERSION} smoke test`;

    // Load pyodide.js dynamically based on version
    const pyodideReady = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full/pyodide.js`;
      s.onload = resolve;
      s.onerror = () => reject(new Error(`Failed to load pyodide.js for version ${PYODIDE_VERSION}`));
      document.head.appendChild(s);
    });
  </script>
  <script>
    const out = document.getElementById('output');
    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      out.appendChild(span);
    }

    // Wheel filename is discovered dynamically from /wasm-dist/ directory listing

    const TESTS = [
      {
        name: 'test_polars_basics',
        code: `
import polars as pl

df = pl.DataFrame(
    {"a": [1, 2, 3, 4], "b": [10, 20, 30, 40], "c": ["x", "y", "z", "w"]}
)

assert df.shape == (4, 3)
assert df.select("a").to_series().to_list() == [1, 2, 3, 4]

result = df.select(pl.col("b").sum()).item()
assert result == 100

result = df.select(pl.col("c").str.to_uppercase()).to_series().to_list()
assert result == ["X", "Y", "Z", "W"]

"ok"
`,
      },
      {
        name: 'test_polars_operations',
        code: `
import polars as pl

df = pl.DataFrame({"nums": [1, 2, 3, None, 5], "groups": ["A", "A", "B", "B", "C"]})

assert df["nums"].null_count() == 1

result = (
    df.group_by("groups")
    .agg(pl.col("nums").mean())
    .sort("groups")
    .to_dict(as_series=False)
)

expected = {"groups": ["A", "B", "C"], "nums": [1.5, 3.0, 5.0]}
assert result == expected

"ok"
`,
      },
      {
        name: 'test_polars_dtypes',
        code: `
import polars as pl

df = pl.DataFrame(
    {
        "ints": [1, 2, 3],
        "floats": [1.1, 2.2, 3.3],
        "strings": ["a", "b", "c"],
        "bools": [True, False, True],
    }
)

assert df["ints"].dtype == pl.Int64
assert df["floats"].dtype == pl.Float64
assert df["strings"].dtype == pl.String
assert df["bools"].dtype == pl.Boolean

result = df.select(pl.col("ints").cast(pl.Float32))
assert result["ints"].dtype == pl.Float32

"ok"
`,
      },
      {
        name: 'test_polars_read_csv',
        code: `
import polars as pl
import io

csv_data = """name,score,passed
Alice,95,true
Bob,82,true
Charlie,58,false
"""

df = pl.read_csv(io.StringIO(csv_data))

assert df.shape == (3, 3)
assert df["name"].to_list() == ["Alice", "Bob", "Charlie"]
assert df["score"].to_list() == [95, 82, 58]
assert df.filter(pl.col("passed")).shape == (2, 3)

"ok"
`,
      },
    ];

    async function main() {
      out.textContent = '';

      // Discover wheel filename dynamically — expect exactly one .whl
      log('Discovering wheel file…', 'info');
      const dirResp = await fetch('./wasm-dist/');
      if (!dirResp.ok) { log('ERROR: Could not list /wasm-dist/', 'err'); return; }
      const dirText = await dirResp.text();
      const wheels = [...new Set([...dirText.matchAll(/polars-[^\s"'<>]+\.whl/g)].map(m => m[0]))];
      if (wheels.length !== 1) {
        log(`ERROR: Expected exactly 1 wheel in /wasm-dist/, found ${wheels.length}: ${wheels.join(', ')}`, 'err');
        return;
      }
      const wheelFile = wheels[0];

      log(`Loading Pyodide ${PYODIDE_VERSION}…`, 'info');
      await pyodideReady;
      const pyodide = await loadPyodide();
      log('Pyodide ready.', 'ok');

      log('Installing polars wheel via micropip…', 'info');
      await pyodide.loadPackage('micropip');
      const micropip = pyodide.pyimport('micropip');

      const wheelUrl = new URL('./wasm-dist/' + wheelFile, location.href).href;
      log('Wheel URL: ' + wheelUrl, 'info');
      await micropip.install(wheelUrl);
      log('Wheel installed.\n', 'ok');

      log('Running tests…', 'info');
      let passed = 0, failed = 0;
      for (const test of TESTS) {
        try {
          await pyodide.runPythonAsync(test.code);
          log('  PASS  ' + test.name, 'pass');
          passed++;
        } catch (e) {
          log('  FAIL  ' + test.name, 'fail');
          log('        ' + e, 'err');
          failed++;
        }
      }

      log('');
      const total = passed + failed;
      if (failed === 0) {
        log(`${passed}/${total} passed`, 'ok');
      } else {
        log(`${passed}/${total} passed, ${failed} failed`, 'fail');
      }
    }

    main().catch(e => {
      log('\nERROR: ' + e, 'err');
      console.error(e);
    });
  </script>
</body>
</html>
